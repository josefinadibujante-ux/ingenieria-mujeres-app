name: Tests

# A propósito, SOLO en push (nunca en pull_request): el repo es público, y
# un pull_request de alguien externo no debe poder disparar un workflow con
# acceso a los secretos (la clave de Firebase real).
on:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Escribir la clave de Firebase (desde el secreto de GitHub)
        run: echo "$FIREBASE_KEY_JSON" > key.json
        env:
          FIREBASE_KEY_JSON: ${{ secrets.FIREBASE_KEY_JSON }}

      - name: Correr la suite de tests
        run: pytest -v
        env:
          GOOGLE_APPLICATION_CREDENTIALS: key.json
