<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscripción · Comunidad de Mujeres Campus Antonio Varas</title>
    <meta name="description" content="Formulario de inscripción a las actividades y talleres de la Comunidad de Mujeres del Campus Antonio Varas.">
    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Griffy&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { background-color: #fdfbfb; background-image: radial-gradient(#ebe0ff 0.5px, transparent 0.5px); background-size: 20px 20px; font-family: 'Quicksand', sans-serif; color: #40114F; }
        .navbar-custom { background: #3b3b58; padding: 15px; color: white; }
        .navbar-custom h4 { font-family: 'Griffy', cursive; font-weight: 400; }
        .card-inscripcion { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(64, 17, 79, 0.12); background: white; }
        .titulo-actividad { font-family: 'Griffy', cursive; color: #6f42c1; }
        .btn-enviar { background: #40114F; color: white; border-radius: 50px; border: none; padding: 14px; font-weight: bold; transition: 0.3s; }
        .btn-enviar:hover { background: #6f42c1; color: white; transform: translateY(-2px); }
    </style>
</head>
<body>
    <nav class="navbar-custom text-center mb-4">
        <h4 class="m-0">Formulario de Inscripción</h4>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card card-inscripcion p-4">
                    <h5 class="text-center mb-3">Postulación para:<br><span class="titulo-actividad fs-4">{{ actividad.titulo }}</span></h5>
                    <p class="text-muted small text-center mb-4">Nos contactaremos contigo vía WhatsApp o correo si resultas elegida para participar.</p>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" name="nombre" class="form-control" placeholder="Ej: Valentina Paz" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Contacto (Celular o Correo)</label>
                            <input type="text" name="contacto" class="form-control" placeholder="Ej: +569... o correo@uandresbello.edu" required>
                        </div>

                        {% for campo in campos_extra %}
                        <div class="mb-3">
                            <label class="form-label fw-bold">{{ campo.etiqueta }}{% if not campo.requerido %} <span class="text-muted fw-normal small">(opcional)</span>{% endif %}</label>
                            {% if campo.tipo == 'opciones' %}
                            <select name="extra_{{ loop.index0 }}" class="form-select" {% if campo.requerido %}required{% endif %}>
                                <option value="" disabled selected>Selecciona una opción</option>
                                {% for opcion in campo.opciones %}
                                <option value="{{ opcion }}">{{ opcion }}</option>
                                {% endfor %}
                            </select>
                            {% else %}
                            <input type="text" name="extra_{{ loop.index0 }}" class="form-control" {% if campo.requerido %}required{% endif %}>
                            {% endif %}
                        </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-enviar w-100 mt-3">Enviar mi Postulación</button>
                    </form>
                    <div class="text-center mt-3">
                        <a href="{{ url_for('actividades') }}" class="text-decoration-none small text-secondary">← Volver atrás</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
