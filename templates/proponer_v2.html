<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Proponer Actividad · Comunidad de Mujeres Campus Antonio Varas</title>

    <meta name="description" content="Propón un taller o actividad para la Comunidad de Mujeres del Campus Antonio Varas, ya sea como alumna o como tutora.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Proponer Actividad · Comunidad de Mujeres Campus Antonio Varas">
    <meta property="og:description" content="¿Tienes un talento o quieres aprender algo nuevo? Envía tu propuesta.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1573163231162-717dfc3e0c1f?auto=format&fit=crop&w=1200&q=80">

    <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Griffy&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body { background-color: #fdfbfb; background-image: radial-gradient(#6f42c133 0.5px, transparent 0.5px); background-size: 20px 20px; font-family: 'Quicksand', sans-serif; }
        .griffy-text { font-family: 'Griffy', cursive; }
        .navbar-custom { background: #3b3b58; padding: 15px; }
        .card-form { border-radius: 20px; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.1); background: white; }
        .btn-submit { background: #40114F; color: white; font-weight: bold; border-radius: 50px; border: none; padding: 15px; transition: 0.3s; }
        .btn-submit:hover { background: #6f42c1; transform: translateY(-2px); color: white; }
        .seccion-tutor { display: none; background-color: #f8f5ff; padding: 20px; border-radius: 15px; border-left: 5px solid #6f42c1; margin-bottom: 20px; }
    </style>
</head>
<body>
    <nav class="navbar-custom mb-4">
        <div class="container text-center">
            <a href="{{ url_for('inicio') }}" class="text-white text-decoration-none fw-bold">← Volver al Inicio</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-7">
                <div class="card card-form p-4 animate__animated animate__fadeIn">
                    <h2 class="griffy-text text-center mb-4">🤝 Proponer Actividad</h2>

                    <form method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-4">
                            <label class="form-label fw-bold" style="color:#6f42c1;">¿Cómo quieres participar?</label>
                            <select name="rol" id="selectRol" class="form-select form-select-lg" onchange="mostrarCamposTutor()" required>
                                <option value="" disabled selected>Selecciona una opción...</option>
                                <option value="alumno">Quiero ser Alumna (Aprender)</option>
                                <option value="tutor">Quiero ser Tutora (Enseñar)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre de la Actividad o Habilidad</label>
                            <input type="text" name="titulo" class="form-control" placeholder="Ej: Taller de Python o Club de Lectura" required>
                        </div>

                        <div id="camposTutor" class="seccion-tutor">
                            <h5 class="griffy-text mb-3">✨ Detalles de Tutora</h5>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">¿Cuál es tu habilidad a enseñar?</label>
                                <input type="text" name="habilidad" id="inputHabilidad" class="form-control" placeholder="Describe tu talento">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold text-dark">¿Qué materiales y ayuda necesitas?</label>
                                <textarea name="materiales" id="inputMateriales" class="form-control" rows="2" placeholder="Ej: Sala con un proyector, materiales de arte..."></textarea>
                            </div>
                            <div class="mb-1">
                                <label class="form-label fw-bold">📞 Déjanos tu contacto</label>
                                <input type="text" name="contacto" id="inputContacto" class="form-control" placeholder="Tu Gmail o número de teléfono">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Categoría sugerida</label>
                                <select name="categoria" class="form-select">
                                    <option value="Talleres">Talleres</option>
                                    <option value="Actividades">Actividades</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Fecha tentativa</label>
                                <input type="date" name="fecha" class="form-control">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">📝 Descripción general</label>
                            <textarea name="descripcion" class="form-control" rows="3" required placeholder="Cuéntanos un poco más..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-submit w-100 fs-5">Enviar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function mostrarCamposTutor() {
            var select = document.getElementById("selectRol");
            var camposTutor = document.getElementById("camposTutor");
            var inputContacto = document.getElementById("inputContacto");
            var inputHabilidad = document.getElementById("inputHabilidad");

            if (select.value === "tutor") {
                camposTutor.style.display = "block";
                inputContacto.required = true;
                inputHabilidad.required = true;
            } else {
                camposTutor.style.display = "none";
                inputContacto.required = false;
                inputHabilidad.required = false;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
